name: Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update rust toolchain
        run: rustup update
      - uses: actions/cache@v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Build
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --release --verbose
      - name: E2E test
        run: |
          cargo install --path .
          bash -euxo pipefail <<'EOF'
            meowda init init.sh
            source init.sh
            meowda create test-venv -p 3.14
            meowda activate test-venv
            meowda install requests
            meowda deactivate
          EOF
          cargo uninstall meowda

  python-package:
    name: Python package (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        # With no format flags, uv builds the wheel from the sdist via PEP 517.
        # bindings = "bin" produces a py3-none platform wheel, not a PyO3 module.
        run: uv build --out-dir dist
      - name: Install wheel
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
      - name: Test installed package and managed environments
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          bash tests/python-package.sh '${{ matrix.python-version }}'
