name: Test

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  run-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update rust toolchain
        run: rustup update
      - uses: actions/cache@v6
        id: cargo-cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --release --verbose
      - name: E2E test
        run: |
          uv build
          uv venv .venv
          uv pip install --python .venv/bin/python dist/*.whl
          export PATH="$PWD/.venv/bin:$PATH"
          bash -euxo pipefail <<'EOF'
            meowda init init.sh
            source init.sh
            meowda create test-venv -p '${{ matrix.python-version }}'
            meowda activate test-venv
            meowda install requests
            python -c 'import requests, sys; assert not ("${{ matrix.python-version }}".endswith("t") and sys._is_gil_enabled())'
            meowda deactivate
          EOF
